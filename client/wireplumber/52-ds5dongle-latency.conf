# ds5-usbip — latence de la sortie du DS5Dongle (PC client)
#
# Blocs de 128 échantillons (2,7 ms) au lieu de 512 (10,7 ms) par défaut, sans
# marge ALSA : le délai propre du dongle passe d'environ 20 ms à environ 5 ms,
# ce qui permet au récepteur RTP (ds5-usbip-haptics.conf) de descendre à
# sess.latency.msec = 20. Validé le 23/11/2026 sur AIBox (plusieurs jeux,
# aucune erreur dans pw-top). En cas de craquements : 256.
#
# Installation : ~/.config/wireplumber/wireplumber.conf.d/ (utilisateur) ou
# /etc/wireplumber/wireplumber.conf.d/ (système), puis :
# systemctl --user restart wireplumber pipewire

monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "DualSense Wireless Controller", media.class = "Audio/Sink" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 128
        api.alsa.headroom    = 0
        node.latency         = "128/48000"
      }
    }
  }
]
