# ds5-usbip — réception des haptiques HD sur le PC client (phase 1)
#
# Reçoit en RTP les canaux haptiques (3-4) de la DualSense émulée dans
# SteamBox (ds5-usbip-proto --haptics-to <IP du client>:46100) et les joue
# sur les canaux 3-4 du DS5Dongle (sortie ds5_dongle_sink, nommée par la
# règle WirePlumber 51-ds5dongle.conf de DS5Dongle-Studio).
#
# Installation : ~/.config/pipewire/pipewire.conf.d/ds5-usbip-haptics.conf
# puis : systemctl --user restart pipewire
# Le dongle doit être en mode « Off » (transmission native) : en mode
# « Replace » il ignore les canaux 3-4, en « Mix » il y ajoute la vibration
# tirée du son du jeu.

context.modules = [
  { name = libpipewire-module-rtp-source
    args = {
      # Réception en unicast sur toutes les interfaces.
      source.ip           = "0.0.0.0"
      source.port         = 46100
      # Tampon réseau visé (LAN) : faible pour suivre l'image.
      sess.latency.msec   = 10
      # Accepter un nouvel émetteur (redémarrage du serveur = nouveau SSRC).
      sess.ignore-ssrc    = true
      node.always-process = true
      # Format envoyé par ds5-usbip (src/haptics_rtp.cpp) : L16 stéréo.
      audio.format        = "S16BE"
      audio.rate          = 48000
      audio.channels      = 2
      # Canaux 3-4 du dongle : haptiques natives gauche / droite. En profil
      # « Direct » (ACP), ses canaux sont FL FR RL RR ; en profil pro-audio,
      # AUX0..AUX3 : remplacer alors par [ AUX2 AUX3 ]. Vérifier avec
      # pw-link -l que les ports arrivent sur les canaux 3-4.
      audio.position      = [ RL RR ]
      stream.props = {
        node.name           = "ds5_usbip_haptics"
        node.description    = "Haptiques DualSense (SteamBox)"
        target.object       = "ds5_dongle_sink"
        # Jamais de repli sur les haut-parleurs si le dongle disparaît.
        node.dont-reconnect = true
        stream.dont-remix   = true
      }
    }
  }
]
