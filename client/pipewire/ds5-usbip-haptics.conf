# ds5-usbip — réception du son de la DualSense sur le PC client
#
# Reçoit en RTP les 4 canaux de la DualSense émulée dans SteamBox (Sunshine
# de sunshine-ds avec LIBVIRTUALHID_DUALSENSE_RTP_CHANNELS=4, ou
# ds5-usbip-proto --rtp-channels 4) : haut-parleur de la manette (1-2) et
# haptiques HD (3-4), joués sur les canaux correspondants du DS5Dongle
# (sortie ds5_dongle_sink, nommée par la règle WirePlumber 51-ds5dongle.conf
# de DS5Dongle-Studio). Émetteur en 2 canaux (haptiques seules) : remettre
# audio.channels = 2 et audio.position = [ RL RR ].
#
# Installation : ~/.config/pipewire/pipewire.conf.d/ds5-usbip-haptics.conf
# puis : systemctl --user restart pipewire
# Le dongle doit être en mode « Off » (transmission native) : en mode
# « Replace » il ignore les canaux 3-4, en « Mix » il y ajoute la vibration
# tirée du son du jeu.

context.modules = [
  { name = libpipewire-module-rtp-source
    args = {
      # Réception en unicast sur toutes les interfaces.
      source.ip           = "0.0.0.0"
      source.port         = 46100
      # Tampon visé. Il doit dépasser le délai de la sortie du dongle (USB
      # puis Bluetooth) : sinon module-rtp-source ramène le tampon à zéro
      # (« Delay to device is higher than the target buffer size ») et ne
      # joue que du silence. 10 ms : silence ; 40 ms : validé le 22/11.
      sess.latency.msec   = 40
      # Accepter un nouvel émetteur (redémarrage du serveur = nouveau SSRC).
      sess.ignore-ssrc    = true
      node.always-process = true
      # Format envoyé par ds5-usbip (src/haptics_rtp.cpp) : L16 stéréo.
      audio.format        = "S16BE"
      audio.rate          = 48000
      audio.channels      = 4
      # Haut-parleur (FL FR) puis haptiques natives gauche / droite (RL RR).
      # En profil « Direct » (ACP), les canaux du dongle sont FL FR RL RR ;
      # en profil pro-audio, AUX0..AUX3 : remplacer alors par
      # [ AUX0 AUX1 AUX2 AUX3 ]. Vérifier avec pw-link -l.
      audio.position      = [ FL FR RL RR ]
      stream.props = {
        node.name           = "ds5_usbip_haptics"
        node.description    = "DualSense : haut-parleur et haptiques (SteamBox)"
        target.object       = "ds5_dongle_sink"
        # Attendre le dongle sans jamais se rabattre sur une autre sortie, et
        # s'y relier dès qu'il apparaît (après un redémarrage de PipeWire, sa
        # sortie arrive après ce flux). node.dont-reconnect détruisait le flux
        # quand la cible manquait au démarrage (22/11).
        node.dont-fallback  = true
        stream.dont-remix   = true
      }
    }
  }
]
